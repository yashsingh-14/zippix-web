<svg viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Top Layer Gradient (Vibrant Sky to Purple) -->
    <linearGradient id="topPlateGrad" x1="10" y1="6" x2="118" y2="66" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#38bdf8" />
      <stop offset="50%" stopColor="#818cf8" />
      <stop offset="100%" stopColor="#c084fc" />
    </linearGradient>

    <!-- Mid Layer Gradient (Deep Sky to Blue) -->
    <linearGradient id="midPlateGrad" x1="10" y1="30" x2="118" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#0ea5e9" />
      <stop offset="100%" stopColor="#3b82f6" />
    </linearGradient>

    <!-- Bottom Layer Gradient (Indigo to Violet) -->
    <linearGradient id="botPlateGrad" x1="10" y1="54" x2="118" y2="114" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#6366f1" />
      <stop offset="100%" stopColor="#a855f7" />
    </linearGradient>

    <!-- Side Bevel Gradients for 3D Depth -->
    <linearGradient id="sideLeftGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#1e3a8a" stopOpacity="0.8" />
      <stop offset="100%" stopColor="#3b82f6" stopOpacity="0.9" />
    </linearGradient>
    <linearGradient id="sideRightGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#4338ca" stopOpacity="0.9" />
      <stop offset="100%" stopColor="#6d28d9" stopOpacity="0.8" />
    </linearGradient>

    <!-- Drop Shadow for layered separation -->
    <filter id="layerShadow" x="-10%" y="-10%" width="130%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.45" />
    </filter>
    <filter id="glowCore" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- BOTTOM LAYER (Layer 3) -->
  <g filter="url(#layerShadow)">
    <!-- 3D Extrusion Side Faces -->
    <polygon points="10,84 64,114 64,122 10,92" fill="#312e81" opacity="0.95" />
    <polygon points="64,114 118,84 118,92 64,122" fill="#4c1d95" opacity="0.95" />
    <!-- Top Face -->
    <polygon points="64,54 118,84 64,114 10,84" fill="url(#botPlateGrad)" />
    <!-- Glossy border outline -->
    <polygon points="64,54 118,84 64,114 10,84" stroke="rgba(255,255,255,0.25)" stroke-width="1.2" />
  </g>

  <!-- MIDDLE LAYER (Layer 2) -->
  <g filter="url(#layerShadow)">
    <!-- 3D Extrusion Side Faces -->
    <polygon points="10,60 64,90 64,98 10,68" fill="#0369a1" opacity="0.95" />
    <polygon points="64,90 118,60 118,68 64,98" fill="#1d4ed8" opacity="0.95" />
    <!-- Top Face -->
    <polygon points="64,30 118,60 64,90 10,60" fill="url(#midPlateGrad)" />
    <!-- Glossy border outline -->
    <polygon points="64,30 118,60 64,90 10,60" stroke="rgba(255,255,255,0.3)" stroke-width="1.2" />
  </g>

  <!-- TOP LAYER (Layer 1) -->
  <g filter="url(#layerShadow)">
    <!-- 3D Extrusion Side Faces -->
    <polygon points="10,36 64,66 64,74 10,44" fill="#0284c7" opacity="0.95" />
    <polygon points="64,66 118,36 118,44 64,74" fill="#6366f1" opacity="0.95" />
    <!-- Top Face -->
    <polygon points="64,6 118,36 64,66 10,36" fill="url(#topPlateGrad)" />
    <!-- Glossy border outline -->
    <polygon points="64,6 118,36 64,66 10,36" stroke="rgba(255,255,255,0.45)" stroke-width="1.4" />
    <!-- Illuminated Center Gem / Vertex Core -->
    <circle cx="64" cy="36" r="4.5" fill="#ffffff" filter="url(#glowCore)" />
    <circle cx="64" cy="36" r="2" fill="#e0f2fe" />
  </g>
</svg>
